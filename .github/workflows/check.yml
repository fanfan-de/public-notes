name: Check public notes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up local checks
        run: python3 scripts/setup.py
      - name: Check files and Git history
        run: python3 scripts/check.py --history
